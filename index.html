<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arteks Brasil - Gestão Profissional</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --warning: #ffc107; --dark: #212529; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #eef2f7; color: #333; }
        nav { background: var(--dark); padding: 10px; display: flex; justify-content: center; gap: 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        nav button { padding: 10px 18px; background: transparent; color: white; border: 1px solid #444; cursor: pointer; border-radius: 6px; transition: 0.3s; font-weight: 500; }
        nav button:hover { background: var(--primary); border-color: var(--primary); }
        .tab { display: none; padding: 25px; max-width: 1100px; margin: auto; animation: fadeIn 0.4s; }
        .tab.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 25px; border-top: 5px solid var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9em; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; background: #fafafa; }
        .btn-calc { background: var(--success); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1em; transition: 0.2s; }
        .btn-calc:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .price-tag { background: #e9f7ef; padding: 15px; border-radius: 8px; border: 1px dashed var(--success); margin-top: 15px; }
        .marketplace-prices { display: flex; gap: 10px; margin-top: 15px; }
        .mp-card { flex: 1; padding: 10px; border-radius: 6px; text-align: center; font-size: 0.85em; background: #fff; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f4f6f9; color: #666; font-size: 0.85em; text-transform: uppercase; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.75em; font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <button onclick="openTab('dashboard')">📊 Dashboard</button>
    <button onclick="openTab('calc')">🧮 Precificação</button>
    <button onclick="openTab('pedidos')">📦 Pedidos</button>
    <button onclick="openTab('config')">⚙️ Configurações</button>
</nav>

<div id="config" class="tab">
    <div class="card">
        <h2>Custos Operacionais Mensais</h2>
        <div class="grid">
            <div class="input-group">
                <label>Aluguel / Espaço (R$)</label>
                <input type="number" id="cfgAluguel" value="210">
            </div>
            <div class="input-group">
                <label>Assinaturas/Software (R$)</label>
                <input type="number" id="cfgSoftwares" value="95">
            </div>
            <div class="input-group">
                <label>Taxa MEI (R$)</label>
                <input type="number" id="cfgMei" value="60">
            </div>
            <div class="input-group">
                <label>Custo KWh Energia (R$)</label>
                <input type="number" id="cfgKwh" value="1.14" step="0.01">
            </div>
